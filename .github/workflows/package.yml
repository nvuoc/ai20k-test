name: Package VPS

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'VPS CPU architecture (uname -m: x86_64 = amd64; aarch64 = arm64)'
        type: choice
        default: linux/amd64
        options:
          - linux/amd64
          - linux/arm64
  push:
    branches: [main, master]
    tags: ['v*']
    paths:
      - 'src/backend/**'
      - 'src/frontend/**'
      - 'deploy/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/package.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'src/backend/**'
      - 'src/frontend/**'
      - 'deploy/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/package.yml'

permissions:
  contents: read
  packages: write    # <--- BẮT BUỘC: Cho phép workflow đẩy Docker image lên GHCR

concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}-${{ inputs.platform || 'linux/amd64' }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PLATFORM: ${{ inputs.platform || 'linux/amd64' }}
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select artifact architecture
        id: target
        shell: bash
        run: |
          case "$PLATFORM" in
            linux/amd64) echo 'arch=amd64' >> "$GITHUB_OUTPUT" ;;
            linux/arm64) echo 'arch=arm64' >> "$GITHUB_OUTPUT" ;;
            *) echo 'Unsupported platform' >&2; exit 1 ;;
          esac

      - name: Enable ARM emulation
        if: env.PLATFORM == 'linux/arm64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend and backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.PLATFORM }}
          load: true
          push: false
          tags: parrotgo:local
          provenance: false
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=parrotgo-${{ steps.target.outputs.arch }}
          cache-to: type=gha,mode=max,scope=parrotgo-${{ steps.target.outputs.arch }}

      - name: Smoke test image with offline fixtures and persistent data
        shell: bash
        run: python3 deploy/smoke_image.py

      - name: Validate HTTPS proxy configuration
        shell: bash
        env:
          DOMAIN: chat.example.com
          ACME_EMAIL: admin@example.com
          BETA_USER: ci
          BETA_PASSWORD_HASH: '$2a$14$Zkx19XLiW6VYouLHR5NmfOFU0z2GTNmpkT/5qqR7hx4IjWJPDhjvG'
        run: |
          docker run --rm --network none \
            -e DOMAIN -e ACME_EMAIL -e BETA_USER -e BETA_PASSWORD_HASH \
            --mount "type=bind,src=$PWD/deploy/Caddyfile,dst=/etc/caddy/Caddyfile,readonly" \
            caddy:2 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      # =========================================================================
      # CÁC BƯỚC ĐẨY LÊN GITHUB CONTAINER REGISTRY (GHCR) OKE
      # =========================================================================
      - name: Log in to GitHub Container Registry
        # Chỉ đẩy lên registry khi commit vào main/tag hoặc chạy manual, không đẩy khi có Pull Request
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          # GHCR bắt buộc tên repository phải viết thường hoàn toàn (lowercase)
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="ghcr.io/$REPO_LC"

          # Gắn tag commit SHA và tag latest
          docker tag parrotgo:local "$IMAGE_NAME:${{ github.sha }}"
          docker tag parrotgo:local "$IMAGE_NAME:latest"

          # Push cả 2 tag lên GHCR
          docker push "$IMAGE_NAME:${{ github.sha }}"
          docker push "$IMAGE_NAME:latest"
