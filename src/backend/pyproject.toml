[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "chat-booking-mvp"
version = "0.1.0"
description = "Vietnamese text booking chatbot with Gemini, VietMap and durable sandbox bookings"
requires-python = ">=3.12,<3.13"
dependencies = [
  "openai>=2,<3",
  "pydantic>=2.11,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "python-dotenv>=1,<2",
  "langgraph>=1,<2",
  "langgraph-checkpoint-sqlite>=3.0.1,<4",
  "tzdata>=2025.1",
  "livekit-api>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "jsonschema>=4.23,<5"]
voice = ["livekit-agents[azure,silero]>=1.8,<2"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
